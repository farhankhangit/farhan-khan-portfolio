<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farhan Khan | E-commerce Web Developer</title>
    <meta
      name="description"
      content="Freelance e-commerce web developer with 7+ years building Shopify, Magento and custom storefronts, from front-end through backend logic, integrations and tracking."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='32' y='34' text-anchor='middle' dominant-baseline='central' font-family='ui-monospace,monospace' font-size='28' font-weight='600' fill='%23fbfbfa'%3EFK%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Stamp the theme before first paint so a dark-mode visitor never sees a
      // white flash while React boots.
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('fkn-portfolio-theme') || 'dark';
        } catch (err) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
